<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">OptiLink proposed mobile interface</title><desc id="desc">Three concept screens: home with Read Text, Find Object and Describe Scene; guided text capture; and spoken text result with repeat and stop controls. This is a design concept, not a working app.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#eef2ff"/><text x="50" y="58" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">OptiLink</text><text x="50" y="91" fill="#475569" font-family="Arial, sans-serif" font-size="18" font-weight="400">Linking vision to voice • Proposed Android interface</text><rect x="60" y="125" width="310" height="590" rx="28" fill="#0f172a"/><rect x="445" y="125" width="310" height="590" rx="28" fill="#0f172a"/><rect x="830" y="125" width="310" height="590" rx="28" fill="#0f172a"/><text x="85" y="170" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">OptiLink</text><text x="85" y="205" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18" font-weight="400">Choose a task</text><rect x="80" y="245" width="270" height="78" rx="16" fill="#1e3a5f"/><text x="98" y="276" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Read Text</text><text x="98" y="302" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" font-weight="400">Hear printed words</text><rect x="80" y="340" width="270" height="78" rx="16" fill="#1e3a5f"/><text x="98" y="371" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Find Object</text><text x="98" y="397" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" font-weight="400">Locate a supported item</text><rect x="80" y="435" width="270" height="78" rx="16" fill="#1e3a5f"/><text x="98" y="466" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Describe Scene</text><text x="98" y="492" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" font-weight="400">Hear a short description</text><rect x="80" y="540" width="270" height="62" rx="16" fill="#a7f3d0"/><text x="102" y="579" fill="#064e3b" font-family="Arial, sans-serif" font-size="20" font-weight="700">Use voice command</text><text x="85" y="649" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16" font-weight="400">Speech: English</text><text x="85" y="681" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16" font-weight="400">Settings and privacy</text><text x="470" y="170" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Read Text</text><text x="470" y="207" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18" font-weight="400">Camera capture</text><rect x="465" y="235" width="270" height="225" rx="16" fill="#334155"/><rect x="513" y="265" width="174" height="156" rx="4" fill="#f8fafc"/><path d="M535 300 H665" stroke="#64748b" stroke-width="5"/><path d="M535 325 H665" stroke="#64748b" stroke-width="5"/><path d="M535 350 H665" stroke="#64748b" stroke-width="5"/><path d="M535 375 H665" stroke="#64748b" stroke-width="5"/><text x="470" y="497" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="17" font-weight="400">Hold the phone steady.</text><text x="470" y="526" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16" font-weight="400">Guidance is also spoken.</text><rect x="465" y="554" width="270" height="60" rx="16" fill="#a7f3d0"/><text x="523" y="591" fill="#064e3b" font-family="Arial, sans-serif" font-size="21" font-weight="700">Capture text</text><text x="470" y="659" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18" font-weight="400">Cancel</text><text x="855" y="170" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Text Result</text><text x="855" y="207" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="17" font-weight="400">Speaking recognized text</text><rect x="850" y="239" width="270" height="190" rx="16" fill="#1e293b"/><text x="870" y="278" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18" font-weight="700">Example notice</text><text x="870" y="318" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="17" font-weight="400">Library opening hours:</text><text x="870" y="350" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="17" font-weight="400">Monday to Friday</text><text x="870" y="382" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="17" font-weight="400">9 AM to 5 PM</text><rect x="850" y="458" width="270" height="58" rx="16" fill="#1e3a5f"/><text x="875" y="495" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Repeat</text><rect x="850" y="535" width="270" height="58" rx="16" fill="#a7f3d0"/><text x="875" y="572" fill="#064e3b" font-family="Arial, sans-serif" font-size="20" font-weight="700">Stop speaking</text><rect x="850" y="612" width="270" height="58" rx="16" fill="#1e3a5f"/><text x="875" y="649" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Capture again</text><text x="60" y="758" fill="#475569" font-family="Arial, sans-serif" font-size="17" font-weight="400">CONCEPT ONLY • Sample content • Accessibility and recognition quality require testing</text></svg>